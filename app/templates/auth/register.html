{% extends 'base.html' %}
{% block title %}Register Teacher{% endblock %}

{% block content %}
<div class="login-bg" style="margin:-2rem; min-height:100vh;">
  <div class="login-card bg-white" style="max-width:480px;">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="fas fa-user-plus text-primary"></i></div>
      <h2 class="fw-bold">Create Teacher Account</h2>
      <p class="text-muted small">FaceAttend – Attendance Management System</p>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="full_name" class="form-control" placeholder="e.g. Dr. Priya Sharma" required />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" placeholder="Choose a username" required />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">College / Institution</label>
          <input type="text" name="college" class="form-control" placeholder="e.g. ABC Engineering College" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4">
        <i class="fas fa-user-check me-2"></i>Create Account
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
